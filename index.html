<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapX Coin</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#fff3a0,#ffc400);
  padding-bottom:90px;
  color:#222;
}

button,#coin{
  -webkit-tap-highlight-color:transparent;
  outline:none;
}

.header{
  height:72px;
  background:#0868dc;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  font-size:28px;
  font-weight:bold;
}

.balance{
  width:90%;
  max-width:500px;
  margin:25px auto;
  padding:15px;
  background:#fff9e8;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  box-shadow:0 5px 12px #999;
}

.smallcoin{
  font-size:60px;
}

.balanceText{
  font-size:20px;
  font-weight:bold;
}

#coins{
  font-size:50px;
}

.mainTitle{
  text-align:center;
  font-size:50px;
  font-weight:bold;
  margin:20px;
}

#tapArea{
  width:320px;
  height:320px;
  margin:auto;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  -webkit-tap-highlight-color:transparent;
}

#coin{
  width:270px;
  height:270px;
  border-radius:50%;
  border:12px solid #fff1a0;
  background:radial-gradient(circle,#ffe45a,#ffb400,#d88900);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:125px;
  cursor:pointer;
  position:relative;
  z-index:2;
  user-select:none;
  box-shadow:0 0 25px #fff,0 12px 25px #9b7000;
  transition:transform .10s ease;
}

#coin:active{
  transform:scale(.90);
}

.ripple{
  position:absolute;
  width:75px;
  height:75px;
  border:5px solid white;
  border-radius:50%;
  pointer-events:none;
  z-index:5;
  animation:rippleEffect .6s ease-out forwards;
}

@keyframes rippleEffect{
  0%{
    opacity:1;
    transform:scale(.3);
  }
  100%{
    opacity:0;
    transform:scale(3.2);
  }
}

.spark{
  position:absolute;
  width:9px;
  height:9px;
  background:white;
  border-radius:50%;
  box-shadow:0 0 12px white;
  pointer-events:none;
  z-index:6;
  animation:sparkEffect .6s ease-out forwards;
}

@keyframes sparkEffect{
  0%{
    opacity:1;
    transform:translate(0,0) scale(1);
  }
  100%{
    opacity:0;
    transform:translate(var(--x),var(--y)) scale(.2);
  }
}

.plus{
  position:absolute;
  color:white;
  font-size:34px;
  font-weight:bold;
  z-index:10;
  pointer-events:none;
  text-shadow:0 2px 5px #8c5d00;
  animation:plusEffect .75s ease-out forwards;
}

@keyframes plusEffect{
  0%{
    opacity:0;
    transform:translateY(0) scale(.6);
  }
  20%{
    opacity:1;
    transform:translateY(-10px) scale(1.15);
  }
  100%{
    opacity:0;
    transform:translateY(-110px) scale(1);
  }
}

.hint{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  margin:20px;
}

.card{
  width:88%;
  max-width:600px;
  margin:15px auto;
  padding:20px;
  border-radius:20px;
  color:white;
  font-size:22px;
  font-weight:bold;
  box-shadow:0 5px 10px #777;
}

.bonus{
  background:#222;
}

.referral{
  background:#087fe5;
}

.page{
  display:none;
  padding-top:20px;
}

.page.active{
  display:block;
}

  width:88%;
  max-width:550
